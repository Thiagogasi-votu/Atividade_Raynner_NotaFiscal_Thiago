<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de nota fiscal</title>
    <link rel="stylesheet" href="../_css/style.css">
</head>

<body>
    <div id="cadastro">
    <h2>Cadastro de nota Fiscal</h2>

    <form action="../_php/style.php" method="post">

        <!-- Campo: Nome -->
        <div>
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" required minlength="3">
        </div>
        <br>

        <!-- Campo: Telefone -->
        <div>
            <label for="telefone">Telefone / Celular:</label><br>
            <input type="tel" id="telefone" name="telefone" placeholder="" required>
        </div>
        <br>

        <!-- Campo: CEP -->
        <div>
            <label for="cep">CEP:</label><br>
            <input type="text" id="cep" name="cep" placeholder="" pattern="" required>
        </div>
        <br>

        <!-- Campo: Endereço -->
        <div>
            <label for="endereco">Endereço:</label><br>
            <input type="text" id="endereco" name="endereco" required>
        </div>
        <br>

        <!-- Campo: Cidade -->
        <div>
            <label for="cidade">Cidade:</label><br>
            <input type="text" id="cidade" name="cidade" required>
        </div>
        <br>

        <!-- Campo: CPF -->
        <div>
            <label for="cpf">CPF:</label><br>
            <input type="text" id="cpf" name="cpf" placeholder=""
                pattern="" required>
        </div>
        <br>

        <!-- Botão de Envio -->
        <div>
            <button type="submit">Cadastrar</button>
        </div>

    </form>
</div>
</body>

</html>
